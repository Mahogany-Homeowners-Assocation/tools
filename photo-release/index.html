<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --mhoa-1:#3176b1; --mhoa-2:#51b3d6; --mhoa-3:#f07730; --mhoa-4:#f2a33c;
    --mhoa-5:#c2ebf8; --mhoa-6:#64b1cf; --mhoa-7:#2183b4; --mhoa-8:#185d86;
    --ink:#1a1a1a; --secondary:#5f5e5a; --muted:#888780;
    --border:#e3e6ea; --border-strong:#cdd3d9;
    --surface-page:#f4f6f8; --surface-card:#ffffff; --surface-inner:#f8fafb;
    --accent:#2183b4; --accent-soft:#c2ebf8; --danger:#a32d2d;
    --success-bg:#c2ebf8; --success-text:#185d86;
    --radius:8px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--surface-page);color:var(--ink);
    line-height:1.5;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 1rem;}
  .wrap{max-width:460px;width:100%;}
  .form-logo{display:block;width:220px;max-width:70%;height:auto;margin:0 auto 14px;}
  .form-title{font-size:20px;font-weight:600;color:var(--mhoa-8);margin:0 0 2px;text-align:center;}
  .form-subtitle{font-size:13px;color:var(--muted);margin:0 0 16px;text-align:center;}
  .shell{background:#e9eef2;border-radius:12px;padding:1.25rem;}
  .progress-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .progress{flex:1;height:4px;background:var(--border);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;width:25%;background:var(--accent);transition:width .25s;}
  .step-label{font-size:12px;color:var(--muted);min-width:40px;text-align:right;}
  .card{background:var(--surface-card);border:1px solid var(--border);border-radius:12px;
    padding:1.5rem 1.25rem;min-height:300px;display:flex;flex-direction:column;}
  h3{margin:0 0 8px;font-size:18px;font-weight:600;color:var(--ink);}
  .sub{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px;}
  .body-text{font-size:14px;color:var(--secondary);line-height:1.6;margin:0 0 4px;}
  label.field-label{display:block;font-size:13px;color:var(--secondary);margin:0 0 4px;}
  input[type=text],input[type=email]{width:100%;height:38px;padding:0 12px;margin-bottom:14px;
    border:1px solid var(--border-strong);border-radius:var(--radius);font-size:15px;
    font-family:var(--font);background:var(--surface-card);color:var(--ink);}
  input[type=text]:focus,input[type=email]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .check-row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:10px;
    padding:12px;border:1px solid var(--border);border-radius:var(--radius);}
  .check-row input{width:18px;height:18px;margin-top:1px;flex:0 0 auto;}
  .check-row span{font-size:14px;line-height:1.5;}
  .req{color:var(--danger);}
  .review-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .review-row .k{color:var(--secondary);}
  .review-row .v{font-weight:600;}
  .err{font-size:13px;color:var(--danger);margin-top:10px;min-height:16px;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  button{font-family:var(--font);font-size:15px;cursor:pointer;height:40px;padding:0 18px;
    border-radius:var(--radius);background:var(--surface-card);border:1px solid var(--border-strong);
    color:var(--ink);transition:background .15s,transform .05s;}
  button:hover{background:var(--surface-inner);}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.55;cursor:default;}
  #next{flex:1;border-color:var(--accent);color:var(--accent);}
  #back{flex:0 0 auto;}
  .done-wrap{text-align:center;margin:auto;}
  .done-circle{width:52px;height:52px;border-radius:50%;background:var(--success-bg);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;color:var(--success-text);}
  .placeholder-note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;}
</style>
</head>

  <h1 class="form-title">Photo &amp; Video Release</h1>
  <p class="form-subtitle">MHOA Event Photography Consent</p>
  <div class="shell">
    <div class="progress-row">
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="step-label" id="step-label">1 / 4</span>
    </div>
    <div class="card" id="card"></div>
    <div class="btn-row">
      <button id="back">Back</button>
      <button id="next">Next</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  var org = "Mahogany HOA";
  var photographer = "Home Again Photography";
  var contact = "info@mahoganyhoa.com";
  var retention = "consent purposes";

  var state = { name:"", email:"", release:false, portfolio:false };
  var step = 0, total = 4;

  var card = document.getElementById('card');
  var backBtn = document.getElementById('back');
  var nextBtn = document.getElementById('next');
  var fill = document.getElementById('progress-fill');
  var stepLabel = document.getElementById('step-label');

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function heading(t, sub){ return "<h3>"+t+"</h3><p class='sub'>"+sub+"</p>"; }
  function field(label,key,type,val,ph){
    return "<label class='field-label'>"+label+"</label>"+
      "<input data-key='"+key+"' type='"+type+"' value=\""+esc(val)+"\" placeholder='"+ph+"' />";
  }
  function checkbox(key,label,checked,required){
    return "<label class='check-row'><input data-key='"+key+"' type='checkbox' "+(checked?"checked":"")+" />"+
      "<span>"+label+(required?" <span class='req'>*</span>":"")+"</span></label>";
  }
  function reviewRow(k,v){ return "<div class='review-row'><span class='k'>"+k+"</span><span class='v'>"+esc(v)+"</span></div>"; }

  function render(){
    fill.style.width = ((step+1)/total*100)+"%";
    stepLabel.textContent = (step+1)+" / "+total;
    backBtn.style.visibility = step===0 ? "hidden" : "visible";
    nextBtn.textContent = step===total-1 ? "Submit" : "Next";
    nextBtn.disabled = false;

    var h="";
    if(step===0){
      h += heading("Your details","We collect your name and email only to record your consent and to contact you about it. Records are kept for "+esc(retention)+" and stored securely.");
      h += field("Name","name","text",state.name,"Jordan Lee");
      h += field("Email","email","email",state.email,"name@example.com");
    } else if(step===1){
      h += heading("Organization use","This form records your consent to be photographed or recorded on video during this event. Photos and videos may be used by "+esc(org)+" for promotional and communication purposes, including social media, newsletters, websites, and print materials.");
      h += "<p class='body-text'>By checking the box below, I grant "+esc(org)+" permission to use my likeness in photographs, video, or other media in its publications, without payment or other consideration. Participation is voluntary, and I may withdraw my consent at any time by contacting "+esc(contact)+". I confirm I am at least 18 years of age, or if completing this for a participant under 18, I am their parent or legal guardian and consent on their behalf.</p>";
      h += checkbox("release","I have read and understood this release and I accept.",state.release,true);
    } else if(step===2){
      h += heading("Photographer portfolio use","Optional — you can decline this and still be included in event photos.");
      h += "<p class='body-text'>Photographs are created by "+esc(photographer)+", who retains copyright. In addition to the use granted above, I grant "+esc(photographer)+" permission to use my likeness to showcase their work, including in their professional portfolio, website, and social media, without payment or other consideration.</p>";
      h += checkbox("portfolio","I agree to the photographer's portfolio use.",state.portfolio,false);
    } else {
      h += heading("Review","Confirm your choices, then submit.");
      h += reviewRow("Name",state.name||"—");
      h += reviewRow("Email",state.email||"—");
      h += reviewRow("Organization use",state.release?"Agreed":"Not agreed");
      h += reviewRow("Portfolio use",state.portfolio?"Agreed":"Declined");
    }
    h += "<div class='err' id='err'></div>";
    card.innerHTML = h;
    wire();
  }

  function wire(){
    card.querySelectorAll('input').forEach(function(el){
      var key = el.getAttribute('data-key');
      if(el.type==='checkbox'){
        el.addEventListener('change',function(){ state[key]=el.checked; setErr(""); });
      } else {
        el.addEventListener('input',function(){ state[key]=el.value; setErr(""); });
      }
    });
  }
  function setErr(msg){ var e=document.getElementById('err'); if(e) e.textContent=msg; }

  function validate(){
    if(step===0){
      if(!state.name.trim()){ setErr("Enter your name."); return false; }
      if(!/^\S+@\S+\.\S+$/.test(state.email.trim())){ setErr("Enter a valid email."); return false; }
    }
    if(step===1 && !state.release){ setErr("You must accept the release to continue."); return false; }
    return true;
  }

  function submit(){
    nextBtn.disabled = true;
    setErr("Saving…");
    var api = window.PHOTO_API_URL;
    if(!api || api.indexOf('PASTE_') === 0){
      nextBtn.disabled = false;
      setErr("This form is not connected yet.");
      return;
    }
    fetch(api, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'saveConsent',
        name: state.name.trim(),
        email: state.email.trim(),
        release: state.release,
        portfolio: state.portfolio
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok){ showDone(); }
      else { nextBtn.disabled = false; setErr((res && res.message) || "Could not save. Try again."); }
    })
    .catch(function(){
      nextBtn.disabled = false;
      setErr("Could not save: network error. Try again.");
    });
  }

  function showDone(){
    card.innerHTML = "<div class='done-wrap'><div class='done-circle'>&#10003;</div><h3>Consent recorded</h3><p class='sub'>Timestamp captured. You're all set.</p></div>";
    backBtn.style.visibility="hidden";
    nextBtn.style.display="none";
    fill.style.width="100%";
    stepLabel.textContent="Done";
  }

  nextBtn.addEventListener('click',function(){
    if(!validate()) return;
    if(step===total-1){ submit(); return; }
    step++; render();
  });
  backBtn.addEventListener('click',function(){ if(step>0){ step--; render(); } });

  render();
})();
</script>
</body>
</html>
